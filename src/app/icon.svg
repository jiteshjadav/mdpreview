<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="bg-main" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-blue" x1="0" y1="0" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card-orange" x1="0" y1="0" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="arrow-glow" x1="160" y1="180" x2="360" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-main)" stroke="#334155" stroke-width="8"/>

  <g transform="translate(30, 72)">
    <g transform="translate(10, 50) skewY(4) scale(0.95)" filter="url(#badge-shadow)">
      <rect x="0" y="0" width="180" height="220" rx="36" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="6"/>
      <path d="M 75 60 L 60 160 M 120 60 L 105 160 M 45 90 L 145 90 M 40 130 L 140 130" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <path d="M 125 150 L 165 200 L 150 208 L 132 178 L 112 188 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
    </g>

    <g filter="url(#badge-shadow)">
      <path d="M 180 160 C 230 85, 310 85, 360 150" fill="none" stroke="#0f172a" stroke-width="34" stroke-linecap="round"/>
      <path d="M 180 160 C 230 85, 310 85, 360 150" fill="none" stroke="url(#arrow-glow)" stroke-width="24" stroke-linecap="round"/>
      <path d="M 330 115 L 380 165 L 320 195" fill="none" stroke="#0f172a" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 330 115 L 380 165 L 320 195" fill="none" stroke="#fdba74" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(250, 50) skewY(-4) scale(0.95)" filter="url(#badge-shadow)">
      <rect x="0" y="0" width="180" height="220" rx="36" fill="url(#card-orange)" stroke="#fed7aa" stroke-width="6"/>
      <path d="M 55 95 L 30 110 L 55 125" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 100 80 L 75 140" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      <path d="M 125 95 L 150 110 L 125 125" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
